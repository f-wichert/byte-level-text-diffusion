# v3.1 PHASE 2, RETROFIT ARM -- 256-dim AE, joint fine-tune with CE + ISOTROPY
# (lambda 10, skip 8, pooled target) branching from the SHARED v1 PHASE-1 CHECKPOINT
# rather than from an isotropy-trained P1 of its own. No whitening warm start.
#
# Naming: v1 = CE only; v3.1 = CE + isotropy lambda 10 / skip 8; the "w" arms
# (v1w/v3w) are the whitening-warm-started instantiations. "-from-v1p1" marks the
# init, following the self-documenting convention used by the diff4 arms.
#
# MATCHED-INIT TRIO: this arm, ae-dim256-v1-phase2 and ae-dim256-v2-phase2 all resume
# checkpoints/ae-dim256-v1-phase1/step_020000.pt with the identical schedule (60k
# absolute, lr 1e-4, warmup 1000, skip 650000, batch 2 x 16). The loss recipe is the
# only variable across the three: CE / CE + uniformity / CE + isotropy. That is the
# clean regularizer ablation at this dim, and the reason to branch rather than run a
# fresh P1.
#
# WHAT THIS ARM MEASURES -- RETROFIT, NOT FORMING. The isotropy penalty here does not
# shape the code as it forms; it must UNDO a code that 20k steps of pure CE already
# formed. That is the hard direction by this project's own evidence (at d=32,
# lambda 0.03 could not even HOLD an already-white space, eig_min 0.33 @2k; the v3
# rationale is "shaping must be active while the code forms, not retrofitted").
#
# THE STARTING POINT IS MAXIMALLY COLLAPSED -- measured 2026-09-21, first ever
# instrumentation of this space (diagnose_latent_spectrum, 28126 words, skip 8,
# standardized by the DiT's own stats artifact):
#   eigen-std max 5.234 / med 0.059 / min 0.0061; top eigenvalue 27.39
#   participation ratio 16.2 effective dims of 256 (WORSE than the famous 23-of-256)
#   top-16 explains 92.7%; decision band t in [0.120, 0.227] = 10.7% of the axis
#   decoder truncation sweep FLAT: CE 0.0337 @k=256 -> 0.0340 @k=24
# So ~232 of the 256 directions are behaviourally DEAD, not merely small, and CE is
# fully satisfied at ~24 dims. Whatever the penalty inflates, CE has no incentive to
# put content there.
#
# PRE-REGISTERED PREDICTION (registered BEFORE the run, from the numbers above): the
# dominant failure mode is DEAD-BUT-ISOTROPIC. The penalty's gradient is dominated by
# the top directions -- (27.4 - 1)^2 ~ 700 for the top eigenvalue vs ~1 for each dead
# one -- so expect it to CRUSH the top of the spectrum first and only then inflate the
# tail, plausibly with noise rather than content. Success is therefore NOT an eig band
# in [0.81, 1.19]; that is cheap to fake. Success is the TRUNCATION SWEEP DEVELOPING
# CLIFFS: CE must rise materially when truncating below 256. Judge that first.
#
# ESTIMATOR -- isotropy_loss_pooled_target IS REQUIRED at d=256 (implemented
# 2026-09-08, src/train.py). The legacy per-micro-batch statistic is shrinkage-
# misspecified here: with N ~ 450 word latents it pulls eigenvalues toward
# ~1/(1 + 2d/N) ~ 0.47, i.e. optimizes toward the WRONG spectrum. Pooled mode keeps the
# gradient per micro-batch but measures the deviation from an EMA of moments pooled
# over whole optimizer steps (N ~ 7200/step, beta 0.1 => ~10 steps effective), ~3.6%
# bias. Gradient identities verified exactly 09-08. JUDGE the objective on
# train/loss_iso_pooled_objective and latents/cov_eig_{min,max}; train/loss_iso is a
# gradient CARRIER in this mode and can go negative.
#
# LAMBDA 10, not the rung-3 hold value 1.0 used by the v3w arms. (a) FORMING/UNDOING is
# not HOLDING: at d=32 lambda 1 / skip 0 left a content direction at eig 0.065 while
# pooled stats read a reassuring 0.74. (b) DIMENSIONAL SCALING (analysis, not
# measurement): the penalty is ||Cov - I||_F^2 / d^2, so its gradient into a latent
# carries 1/d^2 while CE's is at most ~1/d -- the same lambda is 8-64x WEAKER at d=256
# than at d=32. Treat 10 as a FLOOR. If the eig band has not started moving by
# ~2-5k steps, the next rung is ~100, not 20. Cost risk is low: at d=32 lambda 10 showed
# no reconstruction tax, and rung-3 found CE flat across lambda 0.03..1.0.
#
# WATCH -- MARCHENKO-PASTUR FLOOR AT d=256, or the telemetry will read as failure: a
# PERFECTLY white space still shows per-micro-batch eig ~[0.06, 3.08] (N~450,
# meaningless), per-step pooled ~[0.66, 1.41] (N~7200), EMA ~[0.88, 1.12]
# (N_eff~72000). Steer by EMA trends, judge by the instrument. Also watch
# latent_shuffle/gap (v1-P1 ended at 8.15) and val CE vs the v1-P2 twin.
#
# GATE (on step_060000), in priority order:
#   1. truncation sweep has CLIFFS -- CE rises materially at k < 256 (the real test;
#      the k=24 flatness above is the pathology this arm must break).
#   2. diagnose_latent_spectrum eigenvalues in [0.81, 1.19]; PR >= ~248/256.
#   3. val CE at or below the v1-P2 twin at matched steps.
#   Then: uniform-t overfit gate, latent-stats artifact, diffusion pilot judged at 10k
#   splitter vs 687.9 / 913.0.
# EARLY KILL: if by ~15-20k the eig band has tightened while the truncation sweep is
# still flat, that is dead-but-isotropic confirmed -- stop and run the forming arm
# (a from-scratch P1 with the penalty on from step 1) instead.
#
# Run with:
#   python -u diffusion_training/scripts/run_phase1.py configs/training/ae-dim256-v3.1-phase2-from-v1p1.yaml

model:
  pretrained_model_id: Aleph-Alpha/tfree-hat-pretrained-7b-base
  sequence_length: 2048
  decoder_layers: 8
  decoder_hidden_size: 1024
  decoder_self_attention_heads: 8
  decoder_cross_attention_heads: 8
  head_size: 128
  latent_compression_dim: 256
  latent_compression_layers: 4
  latent_compression_hidden_dims: [2048, 1024, 512]

data:
  streaming: true
  sequence_length: 2048
  slices:
    fineweb_edu:
      dataset: HuggingFaceFW/fineweb-edu
      name: sample-10BT
      proportion: 0.63
    wikipedia_en:
      dataset: wikimedia/wikipedia
      name: 20231101.en
      proportion: 0.07

training:
  seed: 1337
  resume_from_checkpoint: checkpoints/ae-dim256-v1-phase1/step_020000.pt
  resume_optimizer: false 
  reset_lr_schedule_on_resume: true
  train_skip_examples_per_slice: 650000

  # ===============================
  freeze_encoder: false
  freeze_encoder_compression: false
  master_weights: true 
  isotropy_loss_enabled: true
  isotropy_loss_lambda: 10.0 
  isotropy_loss_max_latents: 0  
  isotropy_loss_skip_positions: 8 
  isotropy_loss_pooled_target: true  
  isotropy_loss_pooled_beta: 0.1
  uniform_loss_enabled: false   
  anchor_loss_enabled: false
  # ===============================

  batch_size: 2
  gradient_accumulation_steps: 16
  max_steps: 60000  
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.05
  warmup_steps: 1000
  min_lr_ratio: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 5000
  validate_every_steps: 500
  log_every_steps: 10
  logger: wandb
  output_dir: runs/ae-dim256-v3.1-phase2-from-v1p1
  checkpoint_dir: checkpoints/ae-dim256-v3.1-phase2-from-v1p1
  device: cuda:6  
  dtype: bfloat16
  drop_unavailable_data: true
  validation_split: train
  validation_holdout_examples_per_slice: 512
  validation_batches_per_slice: 32
  validation_batch_size: 1
  latent_shuffle_batch_size: 4
  wandb_project: tfree-hat-diffusion-autoencoder
  wandb_entity:
  wandb_run_name: ae-dim256-v3.1-phase2-from-v1p1
  wandb_mode: online
  wandb_tags: [ae-dim256, v3.1, phase2, joint, ce-plus-isotropy, isotropy-lam10, skip8, pooled-target, retrofit, from-v1p1, compress256, master-weights]
