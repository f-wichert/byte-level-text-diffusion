model:
  pretrained_model_id: Aleph-Alpha/tfree-hat-pretrained-7b-base
  sequence_length: 2048
  decoder_layers: 8
  decoder_hidden_size: 1024
  decoder_self_attention_heads: 8
  decoder_cross_attention_heads: 8
  head_size: 128

data:
  streaming: true
  sequence_length: 2048
  slices:
    fineweb_edu:
      dataset: HuggingFaceFW/fineweb-edu
      name: sample-10BT
      proportion: 0.63
    wikipedia_en:
      dataset: wikimedia/wikipedia
      name: 20231101.en
      proportion: 0.07

training:
  seed: 1337
  resume_from_checkpoint: checkpoints/ae-dim4096-v0-phase1/step_020000.pt
  resume_optimizer: false 
  reset_lr_schedule_on_resume: true
  train_skip_examples_per_slice: 650000

  # ===============================
  freeze_encoder: false
  freeze_encoder_compression: false  
  master_weights: false 
  isotropy_loss_enabled: false
  uniform_loss_enabled: false
  anchor_loss_enabled: false
  # ===============================

  batch_size: 2
  gradient_accumulation_steps: 16
  max_steps: 60000 
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.05
  warmup_steps: 1000
  min_lr_ratio: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 5000
  validate_every_steps: 500
  log_every_steps: 10
  logger: wandb
  output_dir: runs/ae-dim4096-v0-phase2
  checkpoint_dir: checkpoints/ae-dim4096-v0-phase2
  device: cuda:5     
  dtype: bfloat16
  drop_unavailable_data: true
  validation_split: train
  validation_holdout_examples_per_slice: 512
  validation_batches_per_slice: 32
  validation_batch_size: 1
  latent_shuffle_batch_size: 4
  wandb_project: tfree-hat-diffusion-autoencoder
  wandb_entity:
  wandb_run_name: ae-dim4096-v0-phase2
  wandb_mode: online
  wandb_tags: [ae-dim4096, v0, phase2, ce-only, no-funnel, joint, bf16-pure, optimizer-ablation]
