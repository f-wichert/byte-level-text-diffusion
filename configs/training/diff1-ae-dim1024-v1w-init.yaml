model:
  pretrained_model_id: Aleph-Alpha/tfree-hat-pretrained-7b-base
  sequence_length: 2048
  decoder_layers: 8
  decoder_hidden_size: 1024
  decoder_self_attention_heads: 8
  decoder_cross_attention_heads: 8
  head_size: 128
  latent_compression_dim: 1024
  latent_compression_layers: 1

autoencoder:
  checkpoint: checkpoints/ae-dim1024-v1w-init/step_000000.pt
  local_files_only: true
  freeze: true
  latent_stats_path: artifacts/latents/latent_stats-ae-dim1024-v1w-init.pt

diffusion:
  latent_dim: 1024
  model_dim: 1024
  num_layers: 12
  num_heads: 16
  mlp_ratio: 4.0
  max_words: 256
  dropout: 0.0
  objective: flow_matching
  prediction: velocity
  sampling_steps: 100
  backbone: plain_dit
  path: cosine
  t_sampling: uniform
  self_conditioning: true
  ce_anchor_enabled: false
  ce_anchor_weight: 0.3
  ce_anchor_x0_clamp: 8.0
  t_power: 1.0

data:
  streaming: true
  sequence_length: 2048
  slices:
    fineweb_edu:
      dataset: HuggingFaceFW/fineweb-edu
      name: sample-10BT
      proportion: 0.63
    wikipedia_en:
      dataset: wikimedia/wikipedia
      name: 20231101.en
      proportion: 0.07

training:
  seed: 1337
  diffusion_dtype: float32
  allow_tf32: true

  resume_from_checkpoint:
  resume_optimizer: false
  train_skip_examples_per_slice: 0

  batch_size: 16
  gradient_accumulation_steps: 2
  max_steps: 200000
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.05
  warmup_steps: 2000
  min_lr_ratio: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 20000
  validate_every_steps: 1000
  log_every_steps: 10
  logger: wandb
  output_dir: runs/diff1-ae-dim1024-v1w-init
  checkpoint_dir: checkpoints/diff1-ae-dim1024-v1w-init
  device: cuda:6 
  dtype: bfloat16 
  drop_unavailable_data: true
  validation_split: train
  validation_holdout_examples_per_slice: 8192
  validation_batches_per_slice: 128
  validation_batch_size: 1
  wandb_project: tfree-hat-diffusion-autoencoder
  wandb_entity:
  wandb_run_name: diff1-ae-dim1024-v1w-init
  wandb_mode: online
  wandb_tags: [diffusion, dim1024, v1w, whitening-warm-start, plain-dit, cosine, velocity, self-cond, float32]

perplexity:
  enabled: true
  every_steps: 5000
  mode: prompt
  decode_mode: splitter 
  prompt_file: configs/eval/prompts_v1.txt
  num_samples: 16
  seed: 20260724 
  evaluator_model: gpt2-large
  evaluator_device: cuda:7
  baseline_at_start: true
  baseline_num_texts: 16
