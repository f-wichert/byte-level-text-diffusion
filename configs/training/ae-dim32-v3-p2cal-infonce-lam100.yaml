model:
  pretrained_model_id: Aleph-Alpha/tfree-hat-pretrained-7b-base
  sequence_length: 2048
  decoder_layers: 8
  decoder_hidden_size: 1024
  decoder_self_attention_heads: 8
  decoder_cross_attention_heads: 8
  head_size: 128
  latent_compression_dim: 32
  latent_compression_layers: 4
  latent_compression_hidden_dims:
  - 2048
  - 1024
  - 512
data:
  streaming: true
  sequence_length: 2048
  slices:
    fineweb_edu:
      dataset: HuggingFaceFW/fineweb-edu
      name: sample-10BT
      proportion: 0.63
    wikipedia_en:
      dataset: wikimedia/wikipedia
      name: 20231101.en
      proportion: 0.07
training:
  seed: 1337
  resume_from_checkpoint: checkpoints/ae-dim32-v3.1-phase1/step_020000.pt
  resume_optimizer: false
  reset_lr_schedule_on_resume: true
  train_skip_examples_per_slice: 650000
  freeze_encoder: false
  freeze_encoder_compression: false
  master_weights: true
  isotropy_loss_enabled: true
  isotropy_loss_lambda: 1.0
  isotropy_loss_max_latents: 0
  isotropy_loss_skip_positions: 0
  uniform_loss_enabled: false
  anchor_loss_enabled: false
  batch_size: 2
  gradient_accumulation_steps: 16
  max_steps: 22000
  lr: 0.0001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.05
  warmup_steps: 1000
  min_lr_ratio: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 22000
  validate_every_steps: 500
  log_every_steps: 10
  logger: wandb
  output_dir: runs/ae-dim32-v3-p2cal-infonce-lam100
  checkpoint_dir: checkpoints/ae-dim32-v3-p2cal-infonce-lam100
  device: cuda:3
  dtype: bfloat16
  drop_unavailable_data: true
  validation_split: train
  validation_holdout_examples_per_slice: 512
  validation_batches_per_slice: 32
  validation_batch_size: 1
  latent_shuffle_batch_size: 4
  wandb_project: tfree-hat-diffusion-autoencoder
  wandb_entity: null
  wandb_run_name: ae-dim32-v3-p2cal-infonce-lam100
  wandb_mode: online
  wandb_tags:
  - ae-dim32-v3
  - rung4
  - infonce
  - calibration
  - lam100
  predictive_loss_enabled: true
  predictive_loss_lambda: 1.0
  predictive_loss_temperature: 0.1
  predictive_loss_min_context: 1
  predictive_loss_max_queries: 0
  predictive_loss_detach_latents: false
  predictive_head_dim: 128
  predictive_head_layers: 2
  predictive_head_heads: 4
  predictive_head_max_positions: 512
